[project]
name = "paperdb"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=2.7",
    "chromadb>=0.5",
    "pymupdf>=1.24",
    "torch>=2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true
